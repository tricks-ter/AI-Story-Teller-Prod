services:
  - type: web
    name: inkmind-api
    runtime: python
    region: oregon
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ZAI_API_KEY
        sync: false        # Set this manually in the Render dashboard
      - key: DATABASE_URL
        sync: false        # Set Neon / Render Postgres connection string
      - key: ALLOWED_ORIGINS
        sync: false        # e.g. https://loreweaver.inkmind.tech
      - key: PYTHON_VERSION
        value: 3.12.3

